name: Reversi move

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: reversi-game
  cancel-in-progress: false

jobs:
  play:
    # Filtering on the "reversi-move" label would be nicer, but GitHub silently
    # drops the `labels=` query param on the "new issue" link for anyone without
    # triage/write access to the repo (i.e. every outside player) — so the label
    # never actually lands on the issue. Match on the title instead, which the
    # link always sets correctly regardless of who clicked it.
    if: contains(github.event.issue.title, 'Move:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ISSUE_TITLE/ISSUE_USER are attacker-controllable (anyone can open an issue).
      # They are passed as env vars, never interpolated into a shell/JS string,
      # to avoid GitHub Actions script-injection.
      - name: Apply move
        id: move
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: python3 scripts/reversi.py apply

      - name: Commit and push
        if: steps.move.outputs.valid == 'true'
        env:
          COMMIT_MESSAGE: ${{ steps.move.outputs.commit_message }}
        run: |
          git config user.name "reversi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add game/state.json README.md
          git commit -m "$COMMIT_MESSAGE"
          git push

      - name: Reply on the issue
        uses: actions/github-script@v7
        env:
          RESULT_MESSAGE: ${{ steps.move.outputs.message }}
        with:
          script: |
            const message = process.env.RESULT_MESSAGE || "Не удалось обработать ход.";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message,
            });
            // Best-effort labeling for browsing/organization only — never blocks
            // processing, since the label may not exist or the bot could lack
            // permission in some edge case.
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ["reversi-move"],
              });
            } catch (err) {
              core.warning(`Could not add reversi-move label: ${err.message}`);
            }
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
            });
